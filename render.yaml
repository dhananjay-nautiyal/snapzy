# Render blueprint — auto-detected when you create a service from this repo.
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: snapzy
    runtime: node
    plan: free
    buildCommand: npm install
    # Re-run the idempotent seed on boot so a fresh/ephemeral disk always
    # has demo content (safe: it won't duplicate existing data).
    startCommand: npm run seed && node server.js
    envVars:
      - key: NODE_ENV
        value: production
      # Render generates a random secret and keeps it stable across redeploys.
      - key: SESSION_SECRET
        generateValue: true
      # Password for the seeded demo accounts (ava/ben/cara). Generated once
      # and stable across redeploys — read it in the Render dashboard to log
      # in as ava for /admin. seed.js never falls back to a published default
      # in production; without this var it uses a random password instead.
      - key: SEED_PASSWORD
        generateValue: true
      # Comma-separated usernames allowed into /admin (the ad manager).
      # Remove or blank this to disable the admin UI entirely.
      - key: ADMIN_USERS
        value: ava
    healthCheckPath: /login
